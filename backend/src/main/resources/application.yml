server:
  servlet:
    session:
      cookie:
        same-site: lax

spring:
  application:
    name: invento
  config:
    # 로컬 비밀값(DB_PASSWORD 등)은 Invento/.env 에 둔다 (git 제외)
    # 작업 디렉터리가 Invento든 backend든 찾을 수 있게 두 경로 모두 지정
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  mvc:
    # 오류를 표준 JSON(ProblemDetail)으로 응답
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${app.db-name}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:invento_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
        # 연관 엔티티·컬렉션을 IN 쿼리로 묶어서 조회 (N+1 방지)
        default_batch_fetch_size: 100
        type:
          # boolean 필드를 DB에 tinyint(0/1)로 저장
          preferred_boolean_jdbc_type: TINYINT

app:
  db-name: ${DB_NAME:goods}
  # 개인용(goods)·포폴(demo)에 따라 켜고 끄는 기능
  features:
    sales-sites: true   # 외부 판매사이트(스마트스토어 등) 관리 - 개인용만
  admin:
    login-id: ${ADMIN_LOGIN_ID}
    password: ${ADMIN_PASSWORD}

logging:
  level:
    org.hibernate.SQL: debug


